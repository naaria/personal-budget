<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de Presupuesto</title>
  <!-- P0: Tailwind por Play CDN (sin npm ni compilar) -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<!-- Logro 1: las clases dark: se activan solas si el sistema está en modo oscuro -->
<body class="min-h-screen bg-gray-50 dark:bg-gray-900">
  <main class="max-w-4xl mx-auto px-4 py-8">
    <header class="mb-6">
      <h1 class="text-3xl font-bold text-gray-800 dark:text-gray-100">💰 Gestor de Presupuesto</h1>
      <p class="text-gray-500 dark:text-gray-400">Tu dinero, bajo control.</p>
    </header>

    <!-- P4: móvil = 1 columna · desde md (768px) = 2 columnas -->
    <section class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- Tarjeta resumen -->
      <div class="p-6 bg-white rounded-xl shadow transition hover:shadow-lg dark:bg-gray-800">
        <h2 class="text-sm font-semibold text-gray-500 uppercase tracking-wide dark:text-gray-400">Saldo total</h2>
        <p id="saldo" class="mt-1 text-4xl font-bold text-gray-800 dark:text-gray-100">$0.00</p>
        <div class="flex gap-4 mt-4">
          <!-- Logro 2: micro-animación al pasar el mouse -->
          <div class="flex-1 p-3 bg-green-50 rounded-lg transition hover:scale-105 dark:bg-green-950">
            <p class="text-xs text-green-700 dark:text-green-300">Ingresos</p>
            <p id="ingresos" class="text-lg font-semibold text-green-700 dark:text-green-300">$0.00</p>
          </div>
          <div class="flex-1 p-3 bg-red-50 rounded-lg transition hover:scale-105 dark:bg-red-950">
            <p class="text-xs text-red-700 dark:text-red-300">Gastos</p>
            <p id="gastos" class="text-lg font-semibold text-red-700 dark:text-red-300">$0.00</p>
          </div>
        </div>
      </div>

      <!-- Tarjeta formulario -->
      <div class="p-6 bg-white rounded-xl shadow transition hover:shadow-lg dark:bg-gray-800">
        <h2 class="mb-4 text-lg font-semibold text-gray-800 dark:text-gray-100">Agregar movimiento</h2>
        <form id="form-mov" class="space-y-3">
          <label for="nombre" class="sr-only">Nombre</label>
          <input id="nombre" type="text" placeholder="Nombre" required
            class="w-full p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:text-gray-100">

          <label for="tipo" class="sr-only">Tipo</label>
          <select id="tipo" class="w-full p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:text-gray-100">
            <option value="ingreso">Ingreso</option>
            <option value="gasto">Gasto</option>
          </select>

          <!-- Logro 3: categoría que se muestra como badge en cada movimiento -->
          <label for="categoria" class="sr-only">Categoría</label>
          <select id="categoria" class="w-full p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:text-gray-100">
            <option value="sueldo">Sueldo</option>
            <option value="trabajo">Trabajo extra</option>
            <option value="comida">Comida</option>
            <option value="transporte">Transporte</option>
            <option value="ocio">Ocio</option>
            <option value="otros">Otros</option>
          </select>

          <label for="monto" class="sr-only">Monto</label>
          <input id="monto" type="number" placeholder="Monto" min="0.01" step="0.01" required
            class="w-full p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:text-gray-100">

          <p id="error" class="text-sm text-red-600 dark:text-red-400" role="alert"></p>

          <button type="submit" class="w-full p-3 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 transition">Agregar</button>
        </form>
      </div>
    </section>

    <section class="mt-6 p-6 bg-white rounded-xl shadow dark:bg-gray-800">
      <h2 class="mb-4 text-lg font-semibold text-gray-800 dark:text-gray-100">Movimientos</h2>
      <!-- P5: vacía; la llena app.js -->
      <ul id="lista" class="space-y-2"></ul>
    </section>
  </main>

  <script src="oop-objects.js"></script>   <!-- class Movimiento y Presupuesto, de C07 -->
  <script src="app.js"></script>
</body>
</html>
