<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de Presupuesto</title>
  <!-- Tailwind por Play CDN: sin npm ni compilación -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-800 antialiased">
  <main class="max-w-4xl mx-auto px-4 py-8 sm:py-12">
    <header class="mb-6 sm:mb-8">
      <h1 class="text-3xl sm:text-4xl font-bold tracking-tight text-slate-900">💰 Gestor de Presupuesto</h1>
      <p class="mt-1 text-slate-500">Tu dinero, bajo control.</p>
    </header>

    <!-- Móvil: 1 columna · desde md (768px): 2 columnas -->
    <section class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- Tarjeta resumen -->
      <div class="rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-200">
        <h2 class="text-sm font-medium uppercase tracking-wide text-slate-500">Saldo total</h2>
        <p id="saldo" class="mt-1 text-4xl font-bold text-blue-600">$0.00</p>
        <div class="flex gap-4 mt-4">
          <div class="flex-1 p-3 rounded-xl bg-emerald-50">
            <p class="text-xs font-medium text-emerald-700">Ingresos</p>
            <p id="total-ingresos" class="text-lg font-semibold text-emerald-700">$0.00</p>
          </div>
          <div class="flex-1 p-3 rounded-xl bg-rose-50">
            <p class="text-xs font-medium text-rose-700">Gastos</p>
            <p id="total-gastos" class="text-lg font-semibold text-rose-700">$0.00</p>
          </div>
        </div>
        <p id="aviso-limite" class="mt-4 text-sm text-slate-500"></p>
      </div>

      <!-- Tarjeta formulario -->
      <div class="rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-200">
        <h2 class="mb-4 text-lg font-semibold text-slate-900">Agregar movimiento</h2>
        <form id="form-movimiento" class="space-y-3" novalidate>
          <div>
            <label for="nombre" class="mb-1 block text-sm font-medium text-slate-700">Nombre</label>
            <input id="nombre" name="nombre" type="text" placeholder="Ej. Salario" autocomplete="off"
              class="w-full rounded-lg border border-slate-300 px-3 py-2 placeholder:text-slate-400 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/30">
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label for="tipo" class="mb-1 block text-sm font-medium text-slate-700">Tipo</label>
              <select id="tipo" name="tipo"
                class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/30">
                <option value="ingreso">Ingreso</option>
                <option value="gasto">Gasto</option>
              </select>
            </div>
            <div>
              <label for="monto" class="mb-1 block text-sm font-medium text-slate-700">Monto</label>
              <input id="monto" name="monto" type="number" placeholder="0.00" min="0.01" step="0.01" inputmode="decimal"
                class="w-full rounded-lg border border-slate-300 px-3 py-2 placeholder:text-slate-400 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/30">
            </div>
          </div>
          <p id="error-form" class="min-h-5 text-sm text-rose-600" role="alert"></p>
          <button type="submit"
            class="w-full rounded-lg bg-blue-600 px-4 py-2.5 font-semibold text-white shadow-sm transition hover:bg-blue-700 active:scale-[0.98] focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2">
            Agregar
          </button>
        </form>
      </div>
    </section>

    <section class="mt-6 rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-200">
      <div class="mb-2 flex items-center justify-between">
        <h2 class="text-lg font-semibold text-slate-900">Movimientos</h2>
        <span id="cantidad" class="rounded-full bg-slate-100 px-3 py-1 text-xs font-medium text-slate-600">0</span>
      </div>
      <!-- Cada <li> muestra lo mismo que datosMovimiento(): "Salario (ingreso): +$3000.00" -->
      <ul id="lista-movimientos" class="divide-y divide-slate-100" aria-live="polite"></ul>
    </section>
  </main>

  <script src="oop-objects.js"></script>
  <script src="app.js"></script>
</body>
</html>
